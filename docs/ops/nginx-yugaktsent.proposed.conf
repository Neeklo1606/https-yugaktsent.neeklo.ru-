# ЮгАкцент — конфиг nginx (аудит 30.10.2026). Применён на сервере 30.10.2026, бэкап /root/nginx-backup-202610292015.tgz.
#
# Что даёт:
#   1. /img/<w>/pbNNNN/uploads/... — ресайз фото Profitbase (0,3–4 МБ → 40–150 КБ) с кэшем на диске.
#      После включения пересобрать фронт с VITE_IMAGE_PROXY=1.
#   2. Swagger /docs закрыт снаружи (A3).
#   3. Заголовки HSTS, X-Content-Type-Options, Referrer-Policy, X-Frame-Options, Permissions-Policy (A3).
#   4. Лимит частоты на вход, регистрацию и заявки (A2), закрыта публичная регистрация (A5).
#
# Как применить (root на 93.188.187.124):
#   tar czf /root/nginx-backup-$(date +%Y%m%d%H%M).tgz /etc/nginx
#   apt-get install -y libnginx-mod-http-image-filter
#   mkdir -p /var/cache/nginx/yug_img && chown www-data /var/cache/nginx/yug_img
#   блок «http-уровень» → /etc/nginx/conf.d/yugaktsent-http.conf
#   блоки server → вместо /etc/nginx/sites-enabled/yugaktsent.neeklo.ru.conf
#   nginx -t && systemctl reload nginx
# Откат: вернуть файлы из архива, nginx -t && systemctl reload nginx.

# ---------- http-уровень: /etc/nginx/conf.d/yugaktsent-http.conf ----------
proxy_cache_path /var/cache/nginx/yug_img levels=1:2 keys_zone=yug_img:16m max_size=700m inactive=30d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=yug_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=yug_forms:10m rate=6r/m;

# ---------- внутренний ресайзер (только localhost) ----------
server {
    listen 127.0.0.1:8099;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    # Только хосты Profitbase — это не открытый прокси
    location ~ "^/r/(480|800|1280)/(pb[0-9]+(\.tochno)?)/(uploads/.+)$" {
        set $w $1;
        set $pb_host $2.profitbase.ru;
        set $pb_path $4;
        proxy_pass https://$pb_host/$pb_path;
        proxy_set_header Host $pb_host;
        proxy_ssl_server_name on;
        proxy_ssl_name $pb_host;
        image_filter resize $w -;
        image_filter_jpeg_quality 78;
        image_filter_interlace on;
        image_filter_buffer 12M;
    }
    location / { return 404; }
}

# ---------- публичный сайт ----------
server {
    listen 80;
    listen [::]:80;
    server_name yugaktsent.neeklo.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yugaktsent.neeklo.ru;

    ssl_certificate     /etc/letsencrypt/live/yugaktsent.neeklo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yugaktsent.neeklo.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20M;
    server_tokens off;

    # Заголовки безопасности. CSP не включаем вслепую: сначала Report-Only на неделю.
    set $sec_hsts "max-age=31536000";
    add_header Strict-Transport-Security $sec_hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/ld+json
        application/xml application/xml+rss application/manifest+json
        image/svg+xml;

    # Публичной регистрации на сайте нет — endpoint закрыт снаружи (A5)
    location = /api/v1/auth/register { return 404; }

    # Вход: 10 попыток в минуту с IP (A2)
    location ~ ^/api/v1/auth/(login|refresh|telegram|change-password) {
        limit_req zone=yug_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Заявки с сайта: 6 в минуту с IP (A2)
    location = /api/v1/requests {
        limit_req zone=yug_forms burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Telegram-webhook: после setWebhook с secret_token раскомментировать проверку (A5)
    # location = /api/v1/telegram-bot/webhook {
    #     if ($http_x_telegram_bot_api_secret_token != "ВСТАВИТЬ_СЕКРЕТ") { return 403; }
    #     proxy_pass http://127.0.0.1:3025;
    # }

    location /api/ {
        proxy_pass http://127.0.0.1:3025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Swagger снаружи закрыт (A3). Смотреть через ssh -L 3025:127.0.0.1:3025 → http://localhost:3025/docs
    location /docs { return 404; }

    # Ресайз фото Profitbase с кэшем на 30 дней
    location ~ "^/img/(480|800|1280)/(pb[0-9]+(\.tochno)?)/(uploads/.+)$" {
        proxy_pass http://127.0.0.1:8099/r/$1/$2/$4;
        proxy_cache yug_img;
        proxy_cache_key $uri;
        proxy_cache_valid 200 30d;
        proxy_cache_valid any 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Img-Cache $upstream_cache_status;
        add_header Strict-Transport-Security $sec_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ^~ /uploads/ {
        alias /srv/yugaktsent-lg/uploads/;
        access_log off;
        expires off;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /assets/ {
        root /var/www/yugaktsent-lg/apps/web/dist;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security $sec_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* ^/[^/]+\.(png|jpe?g|webp|svg|ico|woff2?)$ {
        root /var/www/yugaktsent-lg/apps/web/dist;
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        root /var/www/yugaktsent-lg/apps/web/dist;
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header Strict-Transport-Security $sec_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    }

    access_log /var/log/nginx/yugaktsent.neeklo.ru.access.log;
    error_log  /var/log/nginx/yugaktsent.neeklo.ru.error.log warn;
}
