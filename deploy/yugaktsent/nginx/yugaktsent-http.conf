# ЮгАкцент — http-уровень nginx → /etc/nginx/conf.d/yugaktsent-http.conf
# Ставит deploy/yugaktsent/scripts/install-nginx.sh
proxy_cache_path /var/cache/nginx/yug_img levels=1:2 keys_zone=yug_img:16m max_size=700m inactive=30d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=yug_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=yug_forms:10m rate=6r/m;
